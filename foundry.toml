[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib", "node_modules"]
solc_version = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./config" }]
# Testes em fork por rede: `forge test --match-contract Fork_<key> --fork-url <rpc>`
# (ver test/fork/README.md). Sem fork só rodam os testes unitários.

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
eth = "${ETH_RPC_URL}"
pol = "${POL_RPC_URL}"
op = "${OP_RPC_URL}"
arb = "${ARB_RPC_URL}"
base = "${BASE_RPC_URL}"
avax = "${AVAX_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"

# Testes em fork: muitos parâmetros por chamada (calldata de DEX + medição) → via-IR.
# O bytecode do cofre para deploy continua vindo do profile default (sem via-IR).
[profile.fork]
via_ir = true
