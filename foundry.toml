[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib", "node_modules"]
solc_version = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./config" }]
# Fork tests per network: `forge test --match-contract Fork_<key> --fork-url <rpc>`
# (or run-fork-battery.sh). Each fork test's setUp selects its own fork (RPC from the
# env vars below or a public default); `forge test --no-match-path 'test/fork/*'`
# runs only the unit tests.

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
eth = "${ETH_RPC_URL}"
pol = "${POL_RPC_URL}"
op = "${OP_RPC_URL}"
arb = "${ARB_RPC_URL}"
base = "${BASE_RPC_URL}"
avax = "${AVAX_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"

# Fork tests: many parameters per call (DEX calldata + measurement) → via-IR.
# The vault bytecode for deployment still comes from the default profile (no via-IR).
[profile.fork]
via_ir = true
